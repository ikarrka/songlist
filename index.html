<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        (function () {
            var t = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
<style>
    body {
        visibility: hidden;
    }

    #pageLoader {
        visibility: visible;
    }
</style>
</head>

<body>
    <script>if (window.location.search) {
            document.documentElement.innerHTML = '';
            window.location.href = "https://en.wikipedia.org/wiki/404";
        }
    </script>
<div id="pageLoader">
    <div class="loader-text">Loading songs…</div>
</div>    
    <table id="header_songlist">
        <tr>
            <td id="cell_band_select"></td>
            <td id="cell_letter_select"></td>
            <td id="cell_artist_select"></td>
            <td id="cell_theme_toggle" style="text-align: right; vertical-align: middle;">
                <div class="header-right">
                  <button type="button" id="clearDataBtn" title="Очистить все локальные данные и перезагрузить (потребуется новое разрешение MIDI)" style="margin-right: 10px;">&#x21bb;</button>
                  <button type="button" id="themeToggle" title="Переключить светлую/тёмную тему" aria-label="Переключить тему">&#9789;</button>
                </div>
            </td>

        </tr>
        <!-- <tr>
            <td></td><td></td>
        </tr> -->
    </table>
    <span id="hashRepeat" style="color: red;"><strong>Duplicate hash</strong><br><span id="hashRepeatList"></span><br></span>
    <span id="hashNo" style="color: red;"><strong>No hash</strong><br><span id="hashNoList"></span><br></span>
    <span id="midiContent">
        MIDI device <select id="midiSelectDevice"></select> <span id="midiError" style="color: red;">Wait...</span>
        <button type="button" id="midiModalBtn" class="tool-btn midi-modal-trigger" title="Настроить и отправить MIDI команду" aria-label="MIDI команда">&#127929;</button>
        <hr>
    </span>
    <div class="accordion" id="checkListAccordion">
        <button class="toggle-button">
            <strong>Checklist</strong>
        </button>
        <div class="content" id="checklist"></div>
    </div>

<div id="songlists" aria-live="polite"></div>

<div class="songlist" band="allbands"></div> <!--always at the end-->
    <script>
        const unique = Date.now();

        window.prefix = '';
        window.prefixImage = 'images/';

        document.write(`<script src="${prefix}music.js?v=${unique}"><\/script>`);
        document.write(`<script src="${prefix}midi.js?v=${unique}"><\/script>`);
        document.write(`<script src="${prefix}setlist.js?v=${unique}"><\/script>`);
        document.write(`<script src="${prefix}bootstrap.js?v=${unique}"><\/script>`);

        [`${prefix}color.css`, `${prefix}music.css`].forEach(path => {
            const link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = `${path}?v=${unique}`;
            document.head.appendChild(link);
        });

        (function initThemeToggle() {
            var btn = document.getElementById('themeToggle');
            if (!btn) return;
            function updateLabel() {
                btn.textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? '\u263C' : '\u263D';
            }
            btn.addEventListener('click', function () {
                var html = document.documentElement;
                var next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                html.setAttribute('data-theme', next);
                localStorage.setItem('theme', next);
                updateLabel();
            });
            updateLabel();
        })();
    </script>

<div id="youtubePanel" class="youtube-panel" aria-label="YouTube">
  <div class="youtube-panel-inner">
    <button type="button" class="minimize-btn" id="minimizeModal" aria-label="Свернуть">_</button>
    <button type="button" class="close-btn" id="closeModal" aria-label="Закрыть">×</button>
    <iframe id="youtubeFrame" src="about:blank" frameborder="0"
      referrerpolicy="unsafe-url"
      allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
  </div>
</div>

<div id="mp3Panel" class="mp3-panel" aria-label="MP3">
  <div class="mp3-panel-inner">
    <button type="button" class="minimize-btn" id="minimizeMp3Modal" aria-label="Свернуть">_</button>
    <button type="button" class="close-btn" id="closeMp3Modal" aria-label="Закрыть">×</button>
    <audio id="mp3Player" controls style="width: 100%;"></audio>
  </div>
</div>

<!-- Модальное окно: настройка и отправка MIDI команды -->
<div id="midi-modal" class="midi-modal" aria-hidden="true">
    <div class="midi-modal-content">
        <button type="button" class="midi-modal-close" id="midiModalClose" aria-label="Закрыть">×</button>
        <div class="midi-modal-title-row">
            <span>Отправить MIDI на устройство</span>
            <p class="midi-modal-device" id="midiModalDeviceName"></p>
        </div>
        <div class="midi-modal-form">
            <label>
                Канал (1–16):
                <select id="midiModalChannel">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">10</option>
                    <option value="11">11</option>
                    <option value="12">12</option>
                    <option value="13">13</option>
                    <option value="14">14</option>
                    <option value="15">15</option>
                    <option value="16">16</option>
                </select>
            </label>
            <label>
                MSB (0–127):
                <div class="midi-number-control">
                    <button type="button" class="midi-number-decrement" data-target="midiModalMsb">−</button>
                    <input type="number" id="midiModalMsb" min="0" max="127" value="0" inputmode="numeric" pattern="[0-9]*">
                    <button type="button" class="midi-number-increment" data-target="midiModalMsb">+</button>
                </div>
            </label>
            <label>
                LSB (0–127):
                <div class="midi-number-control">
                    <button type="button" class="midi-number-decrement" data-target="midiModalLsb">−</button>
                    <input type="number" id="midiModalLsb" min="0" max="127" value="0" inputmode="numeric" pattern="[0-9]*">
                    <button type="button" class="midi-number-increment" data-target="midiModalLsb">+</button>
                </div>
            </label>
            <label>
                Program (0–127):
                <div class="midi-number-control">
                    <button type="button" class="midi-number-decrement" data-target="midiModalProgram">−</button>
                    <input type="number" id="midiModalProgram" min="0" max="127" value="0" inputmode="numeric" pattern="[0-9]*">
                    <button type="button" class="midi-number-increment" data-target="midiModalProgram">+</button>
                </div>
            </label>
        </div>
        <div class="midi-modal-actions midi-modal-patch-actions">
            <button type="button" id="midiModalSend" class="midi-modal-send">Отправить Patch</button>
            <label><input type="checkbox" id="midiModalAutoSend"> Автоматическая отправка</label>
        </div>
        <hr class="midi-modal-divider">
        <h4 class="midi-modal-subtitle">SysEx</h4>
        <p class="midi-modal-hint">Байты в HEX через пробел или запятую (F0 и F7 подставятся автоматически при необходимости).</p>
        <input id="midiModalSysex" class="midi-modal-sysex" rows="3" placeholder="41 10 00 00 00 5B 12 ..."></input>
        <div class="midi-modal-actions">
            <button type="button" id="midiModalSendSysex" class="midi-modal-send">Отправить SysEx</button>
        </div>
        <div class="midi-modal-receiver">
            <div class="midi-modal-receiver-heading">
                <span class="midi-modal-subtitle">Входящие MIDI</span>
                <span class="midi-modal-hint" id="midiModalInputStatus">Ожидание MIDI-входа…</span>
                <button type="button" id="midiModalClearReceived" class="midi-modal-clear">Очистить</button>
            </div>
            <pre id="midiModalReceived" class="midi-modal-received" aria-live="polite">Сообщений пока нет.</pre>
        </div>
    </div>
</div>

<!-- Модальное окно только для setlist -->
<div id="setlist-modal" class="setlist-modal">
    <div class="setlist-modal-content">
        <button class="setlist-close" id="setlist-close">×</button>
        <h3>Настройка блока</h3>
        <label>Номер блока:
            <input type="number" id="setlist-block">
        </label>
        <label>Номер песни:
            <div class="setlist-number-control">
                <button type="button" class="setlist-number-decrement" aria-label="Уменьшить номер песни">−</button>
                <input type="number" id="setlist-song" min="0" max="127" value="0" inputmode="numeric" pattern="[0-9]*">
                <button type="button" class="setlist-number-increment" aria-label="Увеличить номер песни">+</button>
            </div>
        </label>
        <button class="setlist-save" id="setlist-save">Сохранить</button>
        <button type="button" class="setlist-autofill" id="setlist-autofill-next" title="Последний блок и следующий номер песни" aria-label="Подставить последний блок и следующий номер песни">🪄</button>
        <button class="setlist-clear" id="setlist-clear">Очистить</button>
    </div>
</div>

<div id="setlistLoader" class="setlist-loader-overlay" hidden>
    <div class="setlist-loader-text">Сохранение данных...</div>
</div>

<button id="scrollToTopBtn" title="Наверх">↑</button>
</body>

</html>
